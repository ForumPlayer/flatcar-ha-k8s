variant: flatcar
version: 1.1.0
ignition:
  config:
    merge:
      - local: ign/31_base-ha-join-cp.ign
storage:
  files:
    - path: /etc/hostname
      overwrite: true
      contents:
        inline: node2-cp
    - path: /etc/systemd/network/00-eth0.network
      contents:
        inline: |
          [Match]
          Name=eth0

          [Network]
          Address=192.168.122.32/24
          Gateway=192.168.122.1
          DNS=192.168.122.1          
    - path: /etc/keepalived/keepalived.conf
      mode: 0644
      contents:
        inline: |
          ! /etc/keepalived/keepalived.conf
          ! Configuration File for keepalived
          global_defs {
              router_id LVS_DEVEL
          }
          vrrp_script check_apiserver {
            script "/etc/keepalived/check_apiserver.sh"
            interval 3
            weight -2
            fall 10
            rise 2
          }
          vrrp_instance VI_1 {
              state MASTER
              interface eth0
              virtual_router_id 51
              priority 100
              authentication {
                  auth_type PASS
                  auth_pass kubevip
              }
              virtual_ipaddress {
                  192.168.122.30/24
              }
              track_script {
                  check_apiserver
              }
          }